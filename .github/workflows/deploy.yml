name: Deploy

on:
  push:
    branches: ['main']
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

# Renovate merges arrive in bursts, and two pushes seconds apart started two
# deploys that raced: the second took a 409 `unable to queue the operation`
# from the functions API while the first was still in flight, and failed
# without deploying anything. It happened three times in September 2026.
# Queueing them removes the race. Deliberately not cancel-in-progress —
# cancelling a run mid-deploy leaves the GCP operation running anyway and
# skips the Fastly purge, so the edge would keep serving the old copy with
# nothing left to fix it.
concurrency:
  group: 'deploy'
  cancel-in-progress: false

jobs:
  deploy:
    name: 'Deploy Cloud Run function'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 'Authenticate with GCP'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/${{ vars.GCP_PROJECT_ID }}/locations/global/workloadIdentityPools/${{ vars.GCP_WIF_POOL }}/providers/${{ vars.GCP_WIF_PROVIDER }}'
          service_account: '${{ vars.GCP_SERVICE_ACCOUNT }}'

      # Deploying a Cloud Run function sends all traffic to the new revision
      # before the smoke test runs, and the functions API cannot deploy without
      # traffic. So note what is serving now, and put traffic back on it if the
      # smoke test fails. The next successful deploy moves traffic to its own
      # revision as usual. On 2026-09-30 a broken SDK upgrade served 500s from
      # the new revision until traffic was moved back by hand.
      - name: 'Record the serving revision'
        id: 'previous'
        run: |
          revision="$(gcloud run services describe "${{ vars.GCP_CLOUD_FUNCTION_ENDPOINT }}" \
            --region='europe-west2' \
            --format='value(status.traffic[0].revisionName)' 2>/dev/null || true)"
          echo "Serving before deploy: ${revision:-none}"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: 'Create or update Cloud Run function'
        id: 'deploy'
        uses: google-github-actions/deploy-cloud-functions@ab10d6b9be21630aafc15ced4c464c16cd6640d6 # v4.0.0
        with:
          name: 'get-historical-climate-data'
          runtime: 'php85'
          entry_point: 'run'
          region: 'europe-west2'
          memory: '256Mi'
          min_instance_count: 0
          max_instance_count: 1
          service_timeout: '60s'
          ingress_settings: 'ALLOW_ALL'
          build_environment_variables: 'COMPOSER_AUTH=${{ secrets.COMPOSER_AUTH }}'
          environment_variables: 'USE_CACHE_TTL=3600,USE_CACHE_BUT_REQUEST_TTL=3600,USE_CACHE_IF_ERROR_TTL=3600,REQUIRED_HEADER_KEY=X-Request-Auth,REQUIRED_ORIGIN=${{ vars.REQUIRED_ORIGIN }},ALLOW_LOCAL_ORIGINS=true,SURROGATE_KEY=${{ vars.GCP_CLOUD_FUNCTION_ENDPOINT }}'
          secrets: |-
            CHRISTIANBROWN_DATABASE_DSN=projects/${{ vars.GCP_PROJECT_ID }}/secrets/CHRISTIANBROWN_DATABASE_DSN/versions/latest
            REQUIRED_HEADER_VALUE=projects/${{ vars.GCP_PROJECT_ID }}/secrets/FASTLY_REQUIRED_HEADER_VALUE/versions/latest

      # Gen2 functions are backed by Cloud Run and are NOT public by default; on
      # Gen2 public reachability is an IAM binding on the underlying Cloud Run
      # service. Requires the deploy service account to have `roles/run.admin`.
      - name: 'Allow unauthenticated invocations'
        run: |
          gcloud run services add-iam-policy-binding "get-historical-climate-data" \
            --region='europe-west2' \
            --member='allUsers' \
            --role='roles/run.invoker'

      # Nothing attaches Cloud SQL here, on purpose. The shared instance (in the
      # separate shared-data-services project) is reached over the /cloudsql unix
      # socket named in CHRISTIANBROWN_DATABASE_DSN, and the attachment is a
      # property of the Cloud Run service that deploy-cloud-functions leaves
      # alone: it is not in the action's updateMask, so every revision the action
      # creates inherits it. A `gcloud run services update
      # --set-cloudsql-instances` step used to run here and re-set it on every
      # deploy. After the first attachment that was a no-op, and it cost a second
      # revision and a second traffic shift every time: on 2026-09-22 the smoke
      # test landed in that gap and took a 500 from Cloud Run's front door. The
      # runtime service account still needs roles/cloudsql.client on that project.

      # Smoke test the new revision against Cloud Run directly, not through the
      # CDN: Fastly's stale-if-error would answer from the last good copy and
      # hide a broken revision behind a 200.
      #
      # The request carries the same shared secret Fastly injects, because the
      # function's auth gate answers 401 to everything without it. A bare `curl`
      # here proved nothing twice over: it was always reading a 401, and it exits
      # 0 on any HTTP status, so the step could not fail. --fail-with-body fixes
      # the second half and prints the error envelope when it does fail.
      #
      # The retry rides out the rollout. A request arriving while Cloud Run is
      # shifting traffic is refused at the front door before it reaches PHP, and
      # with max_instance_count 1 there is no spare instance to absorb it. A
      # single curl cannot tell that apart from a genuinely broken revision;
      # retrying can.
      - name: 'Test Cloud Run function'
        id: 'smoke'
        env:
          REQUIRED_HEADER_VALUE: '${{ secrets.FASTLY_REQUIRED_HEADER_VALUE }}'
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 5 \
            -H "X-Request-Auth: $REQUIRED_HEADER_VALUE" \
            "${{ steps.deploy.outputs.url }}/daily-1-month"

      # Bust the Fastly edge cache so the new revision is served immediately.
      # Surrogate-key purge: the function emits `Surrogate-Key: <endpoint>` on
      # every cached response, so purging that key invalidates ALL of this
      # function's cached objects — including every /{route} subpath — in one
      # call. (The former exact-URL purge only hit the bare path, never the
      # cached subpaths.) The key matches the SURROGATE_KEY env var above.
      # Uses FASTLY_PURGE_API_KEY — a purge-only token (needs purge_select).
      - name: 'Purge Fastly cache'
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            -H "Fastly-Key: ${{ secrets.FASTLY_PURGE_API_KEY }}" \
            -H "Accept: application/json" \
            "https://api.fastly.com/service/${{ vars.FASTLY_SERVICE_ID }}/purge/${{ vars.GCP_CLOUD_FUNCTION_ENDPOINT }}"

      - name: 'Roll back to the previous revision'
        if: ${{ failure() && steps.smoke.outcome == 'failure' && steps.previous.outputs.revision != '' }}
        run: |
          gcloud run services update-traffic "${{ vars.GCP_CLOUD_FUNCTION_ENDPOINT }}" \
            --region='europe-west2' \
            --to-revisions="${{ steps.previous.outputs.revision }}=100"
          echo "::error::The smoke test failed, so traffic is back on ${{ steps.previous.outputs.revision }}"
