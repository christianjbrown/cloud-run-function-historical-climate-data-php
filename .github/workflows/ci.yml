name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: xdebug

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Check code style
        run: ./bin/php-cs ./src ./tests

      - name: Static analysis
        run: ./bin/phpstan analyse --no-progress

      - name: Run tests with coverage
        run: XDEBUG_MODE=coverage php -d memory_limit=-1 ./bin/phpunit

      # The committed openapi.yaml is generated from the `#[OA\...]` attributes in
      # src/. Regenerate it and fail if it differs from what is committed, so an
      # attribute change without a matching regenerate breaks CI. (The contract
      # tests that validate the real PSR-7 responses against this spec run inside
      # the PHPUnit gate above.)
      - name: Check OpenAPI spec is in sync with the attributes
        run: |
          composer openapi:generate
          git diff --exit-code openapi.yaml
